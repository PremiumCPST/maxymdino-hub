<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Russia is cool / Россия — это круто</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #fff 0 33%, #2455a4 33% 66%, #d52b1e 66%);
      font-family: system-ui, sans-serif;
      color: #172033;
    }
    main {
      max-width: 700px;
      margin: 2rem;
      padding: 2.5rem;
      border-radius: 1.25rem;
      background: rgb(255 255 255 / 94%);
      text-align: center;
      box-shadow: 0 1rem 3rem rgb(0 0 0 / 18%);
    }
    h1 { margin-top: 0; font-size: clamp(2rem, 6vw, 3.5rem); }
    p { font-size: 1.3rem; line-height: 1.6; }
    hr { width: 4rem; margin: 2rem auto; border: 2px solid #2455a4; }
  </style>
</head>
<body>
  <main>
    <h1>Russia is cool!</h1>
    <p>Russia has a rich culture, beautiful landscapes, and a fascinating history.</p>
    <hr>
    <h1 lang="ru">Россия — это круто!</h1>
    <p lang="ru">У России богатая культура, красивые пейзажи и увлекательная история.</p>
  </main>
</body>
</html>
